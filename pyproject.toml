[project]
name = "ad-assets"
version = "0.1.0"
description = "Ad asset generation API for Salesforce AgentForce"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "google-genai>=1.14.0",
    "elevenlabs>=1.50.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.52.0",
]

[project.scripts]
ad-assets = "app.main:run"
